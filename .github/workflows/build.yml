name: Build APK

# - Chaque push : APK debug (non signé par une vraie clé) en artefact.
# - Si les secrets de signature existent : APK release signé en artefact.
# - Tag vX.Y.Z : APK release signé publié dans une Release GitHub (voir RELEASING.md).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la Release sur un tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Évite l'installation du paquet "tools" obsolète ; AGP installe le reste au premier build.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Vérifier que le tag correspond à versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à versionName v$v (app/build.gradle.kts)"
            exit 1
          fi

      - name: Exiger la clé de signature pour une release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Secrets de signature absents (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Voir RELEASING.md."
          exit 1

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: audiobooks-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Préparer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signé)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer et vérifier la signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JDAudiobook-${version}.apk"
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --verbose --print-certs "dist/JDAudiobook-${version}.apk"
          else
            echo "::warning::apksigner introuvable, vérification de la signature ignorée"
          fi

      - name: Upload APK release
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: audiobooks-release
          path: dist/*.apk
          retention-days: 90

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
