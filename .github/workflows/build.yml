name: Build APK

# - Every push: unit tests, lint report, debug APK as an artifact.
# - If the signing secrets exist: signed release APK as an artifact.
# - Tag vX.Y.Z: signed release APK published as a GitHub Release (see RELEASING.md).
#   Only the final "release" job can write to the repository; the build job is read-only.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar is a binary committed to the repository: check it is the official one.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Avoids installing the obsolete "tools" package; AGP installs the rest on first build.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Check that the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName v$v (app/build.gradle.kts)"
            exit 1
          fi

      - name: Require the signing key for a release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). See RELEASING.md."
          exit 1

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Reports problems without failing the build (lint.abortOnError is false in app/build.gradle.kts).
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: audiobooks-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename and verify the signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JDAudiobook-${version}.apk"
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --verbose --print-certs "dist/JDAudiobook-${version}.apk"
          else
            echo "::warning::apksigner not found, signature check skipped"
          fi

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: audiobooks-release
          path: dist/*.apk
          retention-days: 90

  # Publishing needs write access to the repository: kept in its own job so that the build above
  # (which runs third-party actions and the Gradle build) never holds that permission.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@v6
        with:
          name: audiobooks-release
          path: dist

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
